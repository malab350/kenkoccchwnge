<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>健康チャレンジ</title>

<style>
body {
  text-align: center;
  font-family: sans-serif;
  padding-top: 80px;
  background-color: #f5f5f5;
}

h1 {
  color: #333333;
}

button {
  width: 220px;
  padding: 18px;
  margin: 12px;
  border: none;
  border-radius: 10px;
  font-size: 20px;
  cursor: pointer;
}

.yellow {
  background-color: yellow;
  color: black;
}

.blue {
  background-color: blue;
  color: white;
}

#message {
  margin-top: 30px;
  font-size: 26px;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>健康チャレンジ！</h1>

<button class="yellow" onclick="showMessage1()">
黄色のボタン
</button>

<br>

<button class="blue" onclick="showMessage2()">
青色のボタン
</button>

<div id="message"></div>

<script>
function showMessage1() {
  document.getElementById("message").innerText =
    "健康を維持しましょう..";
}

function showMessage2() {
  document.getElementById("message").innerText =
    "本気でやりましょう！";
}
</script>

</body>
</html>
